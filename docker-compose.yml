version: '3.8'

services:
  plc-simulator:
    build: .
    container_name: industrial-plc-simulator
    ports:
      - "8001:8001"
    restart: unless-stopped
    environment:
      - TZ=America/Toronto
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s